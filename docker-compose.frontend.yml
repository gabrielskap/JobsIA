version: '3.8'

services:
  # Servico do Frontend (Nginx Unprivileged + React)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: jobsia_web
    restart: always
    # Expoem apenas a porta HTTP padrao (80) no Host, mapeando para a 8080 do container nao-root
    ports:
      - "80:8080"
    environment:
      - TZ=America/Sao_Paulo
    # Volumes persistentes para logs do Nginx (acesso e erro)
    volumes:
      - web_logs:/var/log/nginx
    # Limites de recursos do frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    # Healthcheck para validar a saude do servidor web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# Volumes nomeados para persistencia de logs locais no Host
volumes:
  web_logs:
    driver: local
