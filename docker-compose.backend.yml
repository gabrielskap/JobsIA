services:
  # Servico da API Backend (Express + Node.js)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jobsia_api
    restart: always
    # Expoem a porta 3001 no host para que o Gateway possa se conectar a API
    ports:
      - "3001:3001"
    # Variaveis de ambiente mapeadas a partir do arquivo .env no host
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN} # Em producao, deve apontar para http://10.10.10.72
      - LIA_API_URL=${LIA_API_URL}
      - LIA_API_KEY=${LIA_API_KEY}
      - LIA_API_MODEL=${LIA_API_MODEL}
      - LIA_API_PATH=${LIA_API_PATH}
    # Volumes persistentes para logs do backend
    volumes:
      - api_logs:/app/logs
    # Limites de recursos para garantir estabilidade da VM (CPU/Memoria)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    # Healthcheck para validar a saude do backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

# Volumes nomeados para persistencia de logs locais no Host
volumes:
  api_logs:
    driver: local
