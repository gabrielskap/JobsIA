services:
  # 1. Servico do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: jobsia_postgres
    restart: always
    environment:
      POSTGRES_USER: jobsia_user
      POSTGRES_PASSWORD: Dataprev@123 # Senha padrão configurada pelo usuário
      POSTGRES_DB: jobsia_prod
    ports:
      - "5432:5432" # Exposto caso precise de acesso externo (ex: DBeaver)
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsia_user -d jobsia_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Servico da API Backend (Express + Node.js)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jobsia_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # A API não precisa mais expor portas publicamente, pois o frontend conversa com ela internamente
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - DATABASE_URL=postgresql://jobsia_user:Dataprev%40123@db:5432/jobsia_prod?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LIA_API_URL=${LIA_API_URL}
      - LIA_API_KEY=${LIA_API_KEY}
      - LIA_API_MODEL=${LIA_API_MODEL}
      - LIA_API_PATH=${LIA_API_PATH}
    volumes:
      - api_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 3. Servico do Frontend (Nginx Unprivileged + React)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: jobsia_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    # Mapeamento de porta no host (Porta 80 ou 8080 se rodar junto ao Nginx SSL local)
    ports:
      - "80:8080"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - web_logs:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# Volumes nomeados para persistência de dados e logs locais no Host
volumes:
  pg_data:
    driver: local
  api_logs:
    driver: local
  web_logs:
    driver: local
