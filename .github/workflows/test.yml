name: Testes e cobertura

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsia_test
          POSTGRES_PASSWORD: jobsia_test
          POSTGRES_DB: jobsia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobsia_test -d jobsia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://jobsia_test:jobsia_test@localhost:5432/jobsia_test
      JWT_SECRET: ci-only-jobsia-secret-with-at-least-32-characters
      JOBSIA_ALLOW_DESTRUCTIVE_SCHEMA_TEST: "1"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoria de dependências críticas
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run build
      - run: npm run build:server
      - name: Testes unitários e cobertura
        run: npm run test:coverage
      - name: Esquema em banco descartável
        run: npm run test:schema
      - name: Integração em banco descartável
        run: npm run test:integration
